<!doctype html>
<html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Flow.io · Démonstration simulée</title>
<style>
:root{color-scheme:light;--primary-text-color:#202124;--secondary-text-color:#60656d;--primary-color:#0074b8;--error-color:#b3261e;--divider-color:#d8dde3;--card-background-color:#fff;--secondary-background-color:#f3f5f7;--ha-card-border-radius:18px;background:#eef1f5;color:var(--primary-text-color);font-family:system-ui,sans-serif}
:root.dark{color-scheme:dark;--primary-text-color:#e6eaf0;--secondary-text-color:#a3adba;--primary-color:#69c7ff;--error-color:#ffb4ab;--divider-color:#39424e;--card-background-color:#202833;--secondary-background-color:#27313e;background:#141a22}
body{margin:0;padding:20px}main{max-width:820px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px}p{line-height:1.5}#events{overflow-wrap:anywhere;font-size:.8rem}
</style></head><body><main>
<h1>Flow.io · Aperçu de développement</h1><p>Données fictives. Aucune connexion Home Assistant ou MQTT ; aucune commande physique.</p>
<nav><label>Traitement<select id=treatment><option value=chlorine>Chlore</option><option value=electrolysis>Électrolyse</option><option value=oxygen>Oxygène actif</option><option value=none>Aucun</option></select></label><button id=theme>Changer de thème</button><button id=offline>Simuler hors ligne</button></nav>
<flowio-pool-card></flowio-pool-card><p id=events aria-live=polite></p>
</main><script type=module>
import '/dist/flowio-home-assistant-cards.js';
if(!customElements.get('ha-card')) customElements.define('ha-card', class extends HTMLElement { constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius)}</style><slot></slot>'; } });
const entity=(state, unit)=>({state,attributes:unit?{unit_of_measurement:unit}:{}});
const entities={water_temperature:'sensor.demo_water',air_temperature:'sensor.demo_air',ph:'sensor.demo_ph',ph_setpoint:'number.demo_ph',orp:'sensor.demo_orp',orp_setpoint:'number.demo_orp',pressure:'sensor.demo_pressure',filtration:'switch.demo_filter',ph_pump:'switch.demo_ph',disinfection_pump:'switch.demo_dis',electrolyzer:'switch.demo_swg',lighting:'switch.demo_lights',robot:'switch.demo_robot',treatment_type:'select.demo_treatment',alarm_active:'binary_sensor.demo_alarm',alarm_count:'sensor.demo_alarms',ph_tank:'sensor.demo_ph_tank',disinfection_tank:'sensor.demo_dis_tank'};
const config={type:'custom:flowio-pool-card',treatment:'chlorine',title:'Piscine · Jardin',show_tanks:true,features:{filtration:true,ph_control:true,lighting:true,robot:true},entities};
const states={'sensor.demo_water':entity('27.4','°C'),'sensor.demo_air':entity('22.1','°C'),'sensor.demo_ph':entity('7.2'),'number.demo_ph':entity('7.2'),'sensor.demo_orp':entity('710','mV'),'number.demo_orp':entity('700','mV'),'sensor.demo_pressure':entity('0.85','bar'),'switch.demo_filter':entity('on'),'switch.demo_ph':entity('off'),'switch.demo_dis':entity('off'),'switch.demo_swg':entity('off'),'switch.demo_lights':entity('off'),'switch.demo_robot':entity('off'),'select.demo_treatment':entity('Chlore/Brome'),'binary_sensor.demo_alarm':entity('off'),'sensor.demo_alarms':entity('0'),'sensor.demo_ph_tank':entity('12.6','L'),'sensor.demo_dis_tank':entity('8.3','L')};
const calls=[];const card=document.querySelector('flowio-pool-card');
const hass={states,callService:async(domain,service,data)=>{calls.push({domain,service,data});document.querySelector('#events').textContent='Action simulée : '+JSON.stringify(calls.at(-1));}};
function apply(){card.setConfig(config);card.hass={...hass,states:{...hass.states}};}
window.demo={card,config,hass,calls,apply};
card.addEventListener('hass-more-info',e=>{document.querySelector('#events').textContent='Détail demandé : '+e.detail.entityId;});
document.querySelector('#treatment').addEventListener('change',e=>{config.treatment=e.target.value;hass.states['select.demo_treatment']=entity({chlorine:'Chlore/Brome',electrolysis:'Electrolyse',oxygen:'Oxygène actif',none:'Désactivé'}[config.treatment]);apply();});
document.querySelector('#theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
document.querySelector('#offline').addEventListener('click',()=>{hass.states=Object.fromEntries(Object.entries(hass.states).map(([id,s])=>[id,{...s,state:'unavailable'}]));apply();});
apply();
</script></body></html>
