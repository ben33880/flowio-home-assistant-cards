<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Flow.io · Affichage explicite</title><style>
:root{color-scheme:light;--primary-text-color:#202124;--secondary-text-color:#60656d;--primary-color:#0074b8;--error-color:#b3261e;--divider-color:#d8dde3;--card-background-color:#fff;--secondary-background-color:#f3f5f7;--ha-card-border-radius:18px;background:#eef1f5;color:var(--primary-text-color);font-family:system-ui,sans-serif}
:root.dark{color-scheme:dark;--primary-text-color:#e6eaf0;--secondary-text-color:#a3adba;--primary-color:#69c7ff;--error-color:#ffb4ab;--divider-color:#39424e;--card-background-color:#202833;--secondary-background-color:#27313e;background:#141a22}body{margin:0;padding:20px}main{max-width:820px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px}p{line-height:1.5}#events{overflow-wrap:anywhere;font-size:.8rem}
</style></head><body><main><h1>Flow.io · Choix d’affichage</h1><p>Données fictives, sans connexion HA ou MQTT ni commande physique.</p><nav><label>Préfixe<select id=prefix><option>fio</option><option>piscine</option></select></label><label>État firmware simulé<select id=treatment><option value=chlorine>Chlore</option><option value=electrolysis>Électrolyse</option><option value=oxygen>Oxygène actif</option><option value=none>Désactivé</option></select></label><button id=theme>Changer de thème</button><button id=offline>Simuler hors ligne</button></nav><flowio-pool-card></flowio-pool-card><p id=events aria-live=polite></p></main><script type=module>
import '/dist/flowio-home-assistant-cards.js';
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius)}</style><slot></slot>';}});
const config={type:'custom:flowio-pool-card',title:'Piscine · Jardin',entity_prefix:'fio',display:{measurements:['water_temperature','ph','orp','pressure'],setpoints:['ph_setpoint','orp_setpoint'],equipment:['filtration','ph_pump','disinfection_pump','lighting','robot'],tanks:['ph_tank','ph_tank_percent','disinfection_tank','disinfection_tank_percent'],information:['treatment_type','alarm_active','alarm_count','diagnostics']},tank_slots:{ph:1,disinfection:2}};
let treatment='chlorine';const names={chlorine:'Chlore/Brome',electrolysis:'Electrolyse',oxygen:'Oxygène actif',none:'Désactivé'};
const entity=(state,unit)=>({state,attributes:unit?{unit_of_measurement:unit}:{}}),id=(domain,suffix)=>`${domain}.${config.entity_prefix?config.entity_prefix+'_':''}${suffix}`;
function makeStates(){const definitions={'sensor.io_wat_tmp':entity('27.4','°C'),'sensor.io_air_tmp':entity('22.1','°C'),'sensor.io_ph':entity('7.2'),'sensor.io_orp':entity('710','mV'),'sensor.io_psi':entity('0.85','bar'),'number.pl_ph_setpoint':entity('7.2'),'number.pl_dis_setpoint':entity('700','mV'),'switch.io_flt_pmp':entity('on'),'switch.io_ph_pmp':entity('off'),'switch.io_chl_pmp':entity('off'),'switch.io_chl_gen':entity('off'),'switch.io_lights':entity('off'),'switch.io_robot':entity('off'),'switch.io_wat_htr':entity('off'),'switch.io_fill_pmp':entity('off'),'binary_sensor.alm_any_active':entity('off'),'sensor.alm_active_count':entity('0'),'select.pl_modes_dis':entity(names[treatment]),'sensor.data_114':entity('12.6','L'),'sensor.data_115':entity('63','%'),'sensor.data_116':entity('8.3','L'),'sensor.data_117':entity('41.5','%')};return Object.fromEntries(Object.entries(definitions).map(([key,value])=>{const [domain,suffix]=key.split('.');return [id(domain,suffix),value];}));}
const calls=[],card=document.querySelector('flowio-pool-card');const hass={states:makeStates(),callService:async(domain,service,data)=>{calls.push({domain,service,data});document.querySelector('#events').textContent='Action simulée : '+JSON.stringify(calls.at(-1));}};
function apply(){card.setConfig(config);card.hass={...hass,states:{...hass.states}};}window.demo={config,hass,card,calls,apply,id};
card.addEventListener('hass-more-info',e=>document.querySelector('#events').textContent='Détail demandé : '+e.detail.entityId);
document.querySelector('#prefix').addEventListener('change',e=>{config.entity_prefix=e.target.value;hass.states=makeStates();apply();});
document.querySelector('#treatment').addEventListener('change',e=>{treatment=e.target.value;hass.states[id('select','pl_modes_dis')]=entity(names[treatment]);apply();});
document.querySelector('#theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
document.querySelector('#offline').addEventListener('click',()=>{hass.states=Object.fromEntries(Object.entries(hass.states).map(([key,state])=>[key,{...state,state:'unavailable'}]));apply();});apply();
</script></body></html>
