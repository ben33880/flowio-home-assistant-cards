name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests except README screenshot baselines
        run: npx playwright test --grep-invert @readme-snapshot
      - name: Update README screenshot baselines
        run: npx playwright test --grep @readme-snapshot --update-snapshots
      - name: Verify generated README screenshot baselines
        run: npx playwright test --grep @readme-snapshot
      - name: Rebuild production bundle after browser tests
        run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: flowio-home-assistant-cards
          if-no-files-found: error
          path: dist/flowio-home-assistant-cards.js
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: readme-card-screenshots
          if-no-files-found: error
          path: |
            docs/flowio-pool-card.png
            docs/flowio-history-card.png

  publish-dist:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Refuse to publish a build from an outdated source commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo 'main changed while the build was running. Use the workflow for the newest commit.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: flowio-home-assistant-cards
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: readme-card-screenshots
          path: docs
      - name: Commit the validated bundle and README screenshot baselines
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/flowio-home-assistant-cards.js
          test -s docs/flowio-pool-card.png
          test -s docs/flowio-history-card.png
          git add -f -- dist/flowio-home-assistant-cards.js
          git add -- docs/flowio-pool-card.png docs/flowio-history-card.png
          if git diff --cached --quiet; then
            echo 'The published bundle and README screenshot baselines are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish validated bundle and README screenshots [skip ci]'
          git push origin HEAD:main
