name: Publish HACS prerelease (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version without v, for example 0.1.0-beta.1. Creates a public tag and prerelease after successful tests.'
        required: true
        default: '0.1.0-beta.1'
        type: string

permissions:
  contents: read

concurrency:
  group: flowio-prerelease-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate beta version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a version such as 0.1.0-beta.1, without v.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build final production bundle after browser tests
        run: npm run build
      - name: Record source and checksum
        shell: bash
        run: |
          test -s dist/flowio-home-assistant-cards.js
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/release-metadata.json", JSON.stringify({version:process.env.RELEASE_VERSION,commit:process.env.GITHUB_SHA},null,2)+"\n");'
          cd dist
          sha256sum flowio-home-assistant-cards.js release-metadata.json > SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: prerelease-browser-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: verified-prerelease-bundle
          if-no-files-found: error
          path: |
            dist/flowio-home-assistant-cards.js
            dist/release-metadata.json
            dist/SHA256SUMS

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-prerelease-bundle
          path: dist
      - name: Verify downloaded build
        working-directory: dist
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS
          jq -e --arg sha "$TARGET_SHA" --arg version "$RELEASE_VERSION" '.commit == $sha and .version == $version' release-metadata.json
      - name: Publish new beta tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          EXISTING=$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${TAG}" --jq "map(select(.ref == \"refs/tags/${TAG}\")) | length")
          if [[ "$EXISTING" != '0' ]]; then
            echo "Tag $TAG already exists. Choose a new beta version; tags are never reused." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Préversion de développement Flow.io Home Assistant Cards.

          Contient la carte de pilotage configurable et la carte d'historiques natifs.
          Tests unitaires, vérification TypeScript et tests Chromium exécutés par ce workflow avant publication.
          Les tests utilisent des données et composants HA simulés : ils ne constituent pas une validation sur votre installation.

          Le bundle JavaScript inclut Lit. Vérifier les associations d'entités avant toute commande réelle.
          La configuration d'affichage ne modifie pas le traitement du contrôleur.
          Le fichier release-metadata.json identifie le commit source et la version de distribution.
          SHA256SUMS permet de vérifier les fichiers distribués.

          Voir docs/HACS.md pour l'installation et les limites.
          NOTES
          gh release create "$TAG" dist/flowio-home-assistant-cards.js dist/release-metadata.json dist/SHA256SUMS \
            --target "$TARGET_SHA" \
            --title "Flow.io Cards $TAG" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
