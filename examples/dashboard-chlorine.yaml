# Format par préfixe uniquement. Aucun bloc entities.
title: Piscine Flow.io
views:
  - title: Piscine
    path: piscine
    icon: mdi:pool
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:flowio-pool-card
            title: Piscine
            entity_prefix: fio
            treatment: chlorine
            features:
              filtration: true
              ph_control: true
              lighting: true
              robot: true
      - type: grid
        cards:
          - type: custom:flowio-history-card
            title: Qualité de l’eau · 24 h
            entity_prefix: fio
            hours_to_show: 24
            measurements: [water_temperature, ph, orp, pressure]
